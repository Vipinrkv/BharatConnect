version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: bharatconnect_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: bharatconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bharatconnect_network

  redis:
    image: redis:7-alpine
    container_name: bharatconnect_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bharatconnect_network

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: bharatconnect_backend
    volumes:
      - ./apps/backend:/code
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@postgres:5432/bharatconnect
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    depends_on:
      - postgres
      - redis
    networks:
      - bharatconnect_network

volumes:
  postgres_data:
  redis_data:

networks:
  bharatconnect_network:
    driver: bridge
